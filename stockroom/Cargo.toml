[package]
name = "stockroom"
version = "0.1.0"
description = "Click-and-collect for a small retail chain: the capstone of the tokio-postgres book"
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Connect to PostgreSQL over TLS with rustls (Chapter 12). Without it the service uses NoTls.
tls = ["dep:tokio-postgres-rustls", "dep:rustls", "dep:rustls-native-certs"]

[dependencies]
anyhow = { workspace = true }
async-stream = { workspace = true }
axum = { workspace = true, features = ["macros"] }
bytes = { workspace = true }
clap = { workspace = true }
csv = { workspace = true }
deadpool-postgres = { workspace = true }
dotenvy = { workspace = true }
fastrand = { workspace = true }
futures-util = { workspace = true }
jiff = { workspace = true }
postgres-types = { workspace = true }
rust_decimal = { workspace = true, features = ["serde-with-str"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-postgres = { workspace = true }
tokio-util = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
tokio-postgres-rustls = { workspace = true, optional = true }

[dev-dependencies]
http-body-util = { workspace = true }
tower = { workspace = true }
