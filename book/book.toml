# The chapter registry. One [[chapter]] per chapter, in reading order; `tools/book.py`
# reads it for every command, and the contents table in README.md is generated from it
# (`python3 tools/book.py index`).
#
# Fields
#   id       Stable slug, the handle `book.py pdf <id>` and `check --chapter` accept
#            (both also take the number: the file name's prefix, as in `pdf 8`).
#   path     Relative to book/.
#   title    Must equal the chapter's own `# ` heading once the file exists.
#   summary  One line, no trailing period: what the README's contents table shows.
#   status   planned | draft | current.
#              planned  the file may not exist yet; nothing is checked
#              draft    the file exists; its runnable blocks, links and excerpts are checked
#              current  finished: also included in the book PDF (book/tokio-postgres-book.pdf)
#
# The outline each chapter is written from is in PLAN.md §7.

