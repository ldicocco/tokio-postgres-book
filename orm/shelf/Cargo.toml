[package]
name = "shelf"
version = "0.1.0"
description = "A small ORM on tokio-postgres, built chapter by chapter in orm/book/"
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["deadpool"]
# The Executor impls for deadpool-postgres's pooled connections and their transactions.
deadpool = ["dep:deadpool-postgres"]

[dependencies]
bytes = { workspace = true }
deadpool-postgres = { workspace = true, optional = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shelf-macros = { workspace = true }
thiserror = { workspace = true }
tokio-postgres = { workspace = true }

[dev-dependencies]
dotenvy = { workspace = true }
jiff = { workspace = true }
postgres-types = { workspace = true }
tokio = { workspace = true }
trybuild = { workspace = true }
uuid = { workspace = true }
