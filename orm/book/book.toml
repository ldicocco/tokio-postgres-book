# The shelf book's chapter registry: the same format as the main book's (book/book.toml),
# read by `python3 tools/book.py --book orm …`. One [[chapter]] per chapter, in reading order;
# the contents table in orm/README.md is generated from it (`book.py --book orm index`).
#
# A chapter not written yet has a sketch in its place (status `sketch`; orm/SKETCHES.md), and
# the book PDF contains the sketches too, so that it shows the whole book's shape.
#
# The outline each chapter is written from is in orm/PLAN.md §7.

[book]
title = "Building an ORM on tokio-postgres"
pdf = "shelf-book.pdf"
playground = "orm/playground"
package = "shelf-playground"
example_prefix = "shelf_"
check_db = "tpbook_shelf_check"
readme = "orm/README.md"
docs = ["orm/README.md", "orm/PLAN.md", "orm/CLAUDE.md", "orm/SKETCHES.md"]
chapter_pdfs = "target/book/shelf"
pdf_statuses = ["current", "draft", "sketch"]
kicker = "A build-along course"
subtitle = "Derive macros, a model layer and a typed query builder on tokio-postgres, built from scratch as shelf — for readers of Async PostgreSQL in Rust."

