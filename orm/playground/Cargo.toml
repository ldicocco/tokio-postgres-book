# The shelf book's playground: its runnable examples are generated into examples/ by
# `python3 tools/book.py --book orm extract` (never edit them by hand). Unlike the main book's
# playground, whose Cargo.toml Chapter 0 prints for readers to copy, this one inherits every
# version from the workspace.
[package]
name = "shelf-playground"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
deadpool-postgres = { workspace = true }
futures-util = { workspace = true }
jiff = { workspace = true }
playground = { workspace = true }
postgres-types = { workspace = true }
prettyplease = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shelf = { workspace = true }
shelf-codegen = { workspace = true }
syn = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-postgres = { workspace = true }
uuid = { workspace = true }
